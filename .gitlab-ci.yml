# ================================
# TOOLING - CI
# ================================

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == "main"
    - when: never

stages:
  - validate
  - test

variables:
  ALPINE_IMAGE: "alpine:3.24"
  BATS_IMAGE: "bats/bats:1.14.0"
  SHELLCHECK_IMAGE: "koalaman/shellcheck-alpine:v0.11.0"

# A tag whose format is not the one of VERSION_TAG_REGEX (group variable) fails here.
tag-format:
  stage: validate
  image: ${ALPINE_IMAGE}
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      regex="${VERSION_TAG_REGEX:-}"
      regex="${regex#/}"
      regex="${regex%/}"
      if [ -z "$regex" ]; then
        echo "ERROR: VERSION_TAG_REGEX is not set. It is a variable of the zairakai group."
        exit 1
      fi
      if ! printf '%s\n' "$CI_COMMIT_TAG" | grep -Eq "$regex"; then
        echo "ERROR: the tag \"$CI_COMMIT_TAG\" does not match $VERSION_TAG_REGEX."
        exit 1
      fi
      echo "Tag $CI_COMMIT_TAG: format OK"

shellcheck:
  stage: validate
  image:
    name: ${SHELLCHECK_IMAGE}
    entrypoint: [""]
  script:
    - find scripts make tests -name "*.sh" -print0 | xargs -0 shellcheck -x

bats:
  stage: test
  image:
    name: ${BATS_IMAGE}
    entrypoint: [""]
  before_script:
    - apk add --no-cache git make
  script:
    - bats -r tests/unit
